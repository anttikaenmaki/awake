name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Build and self-test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Check shell syntax with the system Bash
        run: |
          /bin/bash --version | head -n 1
          for script in bin/awake bin/awake-helper tests/cli/awake-self-test scripts/*.sh tools/*.sh tools/homebrew/*.sh install-awake.sh uninstall-awake.sh; do
            /bin/bash -n "$script"
          done

      - name: Check that the version number is consistent
        run: /bin/bash tools/release.sh --check

      - name: Build Awake.app
        run: tools/build-awake-app.sh --output-app build/Awake.app

      - name: Check the app signature
        run: codesign --verify --strict --verbose=2 build/Awake.app

      - name: Check the app icons
        run: |
          test -f build/Awake.app/Contents/Resources/AppIcon.icns
          for icns in app/AwakeStatusApp/Assets/AppIcon.icns "Install Awake.app/Contents/Resources/AppIcon.icns" "Uninstall Awake.app/Contents/Resources/AppIcon.icns"; do
            iconutil -c iconset -o "$RUNNER_TEMP/check.iconset" "$icns"
            ls "$RUNNER_TEMP/check.iconset"
            rm -rf "$RUNNER_TEMP/check.iconset"
          done

      - name: Build the GUI picker and launcher helpers
        run: |
          swiftc -O -framework AppKit tools/awake-gui-picker.swift -o build/awake-gui-picker
          swiftc -O -framework AppKit tools/gui-app-launcher.swift -o build/gui-app-launcher

      # The installer builds for the Mac it runs on, so an API newer than the
      # oldest supported macOS (12.5, see README Requirements) would only fail
      # there. Build for it here.
      - name: Check that the Swift code builds for macOS 12.5
        run: |
          swiftc -target arm64-apple-macos12.5 -framework AppKit -framework Carbon -framework WebKit -framework UserNotifications \
            app/AwakeStatusApp/Sources/*.swift -o "$RUNNER_TEMP/AwakeStatusBar-macos12"
          swiftc -target arm64-apple-macos12.5 -framework AppKit tools/awake-gui-picker.swift -o "$RUNNER_TEMP/awake-gui-picker-macos12"
          swiftc -target arm64-apple-macos12.5 -framework AppKit tools/gui-app-launcher.swift -o "$RUNNER_TEMP/gui-app-launcher-macos12"

      # HeatReport.swift uses Foundation only, so its check builds with that
      # file alone and runs on the arm64 runner.
      - name: Check the heat report
        run: |
          swiftc -target arm64-apple-macos12.5 -parse-as-library \
            app/AwakeStatusApp/Sources/HeatReport.swift tests/app/heat-report-check.swift \
            -o "$RUNNER_TEMP/heat-report-check"
          "$RUNNER_TEMP/heat-report-check"

      # StartShortcut.swift uses Foundation only. Its check also imports
      # Carbon and AppKit, to compare the model's key codes and modifier
      # flags with theirs.
      - name: Check the start shortcut
        run: |
          swiftc -target arm64-apple-macos12.5 -parse-as-library -framework AppKit -framework Carbon \
            app/AwakeStatusApp/Sources/StartShortcut.swift app/AwakeStatusApp/Sources/PickerSettings.swift \
            tests/app/start-shortcut-check.swift \
            -o "$RUNNER_TEMP/start-shortcut-check"
          "$RUNNER_TEMP/start-shortcut-check"

      # StatusIcon.swift uses Foundation only, so its check builds with that
      # file alone.
      - name: Check the menu bar icon
        run: |
          swiftc -target arm64-apple-macos12.5 -parse-as-library \
            app/AwakeStatusApp/Sources/StatusIcon.swift tests/app/status-icon-check.swift \
            -o "$RUNNER_TEMP/status-icon-check"
          "$RUNNER_TEMP/status-icon-check"

      # The tap workflow fills in this template at each release.
      - name: Check the Homebrew cask template
        run: |
          /bin/bash tools/homebrew/render-cask.sh 0.0.0 "$(printf '0%.0s' {1..64})" > "$RUNNER_TEMP/awake.rb"
          ruby -c "$RUNNER_TEMP/awake.rb"

      # The cask's uninstall step runs the uninstaller only for brew
      # uninstall, not before an upgrade or a reinstall. A stand-in for
      # brew.rb runs it, with a stand-in uninstaller.
      - name: Check the Homebrew uninstall step
        run: |
          stage="$RUNNER_TEMP/brew-stage"
          mkdir -p "$stage/Homebrew"
          cp scripts/homebrew-uninstall.sh "$stage/"
          printf '#!/bin/bash\necho UNINSTALLED\n' > "$stage/uninstall-awake.sh"
          printf '#!/bin/bash\n/usr/bin/env /bin/bash "%s/homebrew-uninstall.sh"\n' "$stage" > "$stage/Homebrew/brew.rb"
          for command in "uninstall awake" "uninstall --zap anttikaenmaki/awake/awake" "rm awake"; do
            output="$(/bin/bash "$stage/Homebrew/brew.rb" $command)"
            [[ "$output" == UNINSTALLED ]] || { echo "brew $command did not uninstall: $output"; exit 1; }
          done
          for command in "upgrade" "--verbose upgrade awake" "reinstall awake"; do
            output="$(/bin/bash "$stage/Homebrew/brew.rb" $command)"
            [[ "$output" == "Keeping Awake installed"* ]] || { echo "brew $command did not keep Awake: $output"; exit 1; }
          done
          output="$(/bin/bash "$stage/homebrew-uninstall.sh")"
          [[ "$output" == "Awake stays installed"* ]] || { echo "Outside brew it did not keep Awake: $output"; exit 1; }

      - name: Run the dry-run self-test
        run: /bin/bash tests/cli/awake-self-test
